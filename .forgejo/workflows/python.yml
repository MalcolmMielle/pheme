# Forgejo Actions — Python pipeline (lint, type check, unittest suite).
#
# Runs on the runner labelled `node-22`, which provides the node:22 image:
# uv bootstraps a managed Python ≥ 3.13 there (the image's system Python is
# 3.11, too old for requires-python >= 3.13).

name: Python

on: [push, pull_request]

jobs:
  test:
    runs-on: node-22
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check app/ tests/

      - name: Type check (basedpyright)
        run: uv run basedpyright app/ tests/

      - name: Run tests (unittest)
        run: uv run python -m unittest discover -s tests -v
