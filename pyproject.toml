[project]
name = "pheme"
version = "0.1.0"
description = "Pheme — a federated review website using ActivityPub — like Google Maps but decentralized"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "cryptography>=44.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.0",
    "bcrypt>=4.0,<4.1",
    "python-dotenv>=1.2.2",
    "slowapi>=0.1.10",
    "starlette-csrf>=3.0.0",
]

[project.scripts]
pheme = "app.main:main"
bootstrap = "app.bootstrap:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "basedpyright>=1.28.0",
    "httpx>=0.28.0",
]

# ── RUFF ──────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
indent-width = 4
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F722", "F821"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ── basedpyright ──────────────────────────────────────────────────────
[tool.basedpyright]
typeCheckingMode = "standard"
deprecateTypingAliases = true
