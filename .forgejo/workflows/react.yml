# Forgejo Actions — React pipeline (production build of react-app/).
#
# Runs on the runner labelled `node-22`, which provides the node:22 image
# and its npm.

name: React

on: [push, pull_request]

jobs:
  build:
    runs-on: node-22
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          cd react-app
          npm ci

      - name: Build React app
        run: |
          cd react-app
          npm run build
