<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Pheme — Map</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%235b5bd6'/><stop offset='1' stop-color='%23a855f7'/></linearGradient></defs><path fill='url(%23g)' d='M12 1.8a7.2 7.2 0 0 0-7.2 7.2c0 5.4 7.2 13.2 7.2 13.2s7.2-7.8 7.2-13.2A7.2 7.2 0 0 0 12 1.8z'/><path fill='white' d='M12 6.1l1.25 2.53 2.79.4-2.02 1.97.48 2.78L12 12.65l-2.5 1.31.48-2.78-2.02-1.97 2.79-.4z'/></svg>"
    />
    <script>
      // Set the theme before first paint (mirrors initTheme in src/theme.ts):
      // persisted choice wins, otherwise follow the OS setting.
      try {
        var t = localStorage.getItem("pheme-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
