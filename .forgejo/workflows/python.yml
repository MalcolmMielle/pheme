# Forgejo Actions — Python pipeline (lint, type check, unittest suite).
#
# Runs on the runner labelled `node-22`, which provides the node:22 image:
# uv bootstraps a managed Python ≥ 3.13 there (the image's system Python is
# 3.11, too old for requires-python >= 3.13).

name: Python

on: [push]

jobs:
  test:
    runs-on: node-22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v7.1.4
        with:
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: "uv.lock"
          github-token: ${{ secrets.GITHUBAUTH }}

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Ruff Check
        run: uv run ruff check app/ tests/

      - name: Ruff Format Check
        run: uv run ruff format --check app/ tests/

      - name: Type check (basedpyright)
        run: uv run basedpyright app/ tests/

      - name: Run tests (unittest)
        run: uv run python -m unittest discover -s tests -v
