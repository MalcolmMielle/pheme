# Forgejo Actions — release pipeline.
#
# Pushing a tag (`git tag v0.2.0 && git push origin v0.2.0`) runs this
# workflow: it packages a source snapshot of the tagged tree (git archive →
# release/) and uploads it to a Forgejo release for the tag via the
# forgejo-release action. No build step — a source snapshot is enough for
# now; a PyPI release can come later.
#
# The package version is still derived from the tag by hatch-vcs
# ([tool.hatch.version] source = "vcs" in pyproject.toml), which is what a
# future PyPI release will use.
#
# Runs on the runner labelled `node-22` (provides git + node for the action).
# The action's token defaults to the automatic forgejo token, which has write
# access on push events.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: node-22
    steps:
      - uses: actions/checkout@v4

      - name: Package a source snapshot of the tagged tree
        run: |
          mkdir -p release
          git archive --format=tar.gz --prefix="pheme-${{ forgejo.ref_name }}/" \
            -o "release/pheme-${{ forgejo.ref_name }}.tar.gz" HEAD
          git archive --format=zip --prefix="pheme-${{ forgejo.ref_name }}/" \
            -o "release/pheme-${{ forgejo.ref_name }}.zip" HEAD
          ls -la release

      - uses: https://code.forgejo.org/actions/forgejo-release@v2.7.3
        with:
          url: "https://forge.mielle.dev"
          repo: "${{ forgejo.repository }}"
          direction: upload
          tag: "${{ forgejo.ref_name }}"
          sha: "${{ forgejo.sha }}"
          release-dir: release
          override: false
          verbose: false
          hide-archive-link: true
          release-notes-assistant: false
